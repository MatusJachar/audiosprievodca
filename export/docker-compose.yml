version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: spissky-hrad-db
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spissky-hrad-api
    restart: always
    ports:
      - '8002:8001'
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=spissky_hrad
    depends_on:
      - mongodb
    volumes:
      - uploads:/app/uploads
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: spissky-hrad-proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - app-network

  # Let's Encrypt SSL certificate auto-renewal
  certbot:
    image: certbot/certbot
    container_name: spissky-hrad-certbot
    volumes:
      - ./docker/ssl:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-network

volumes:
  mongo_data:
  uploads:
  certbot_www:

networks:
  app-network:
    driver: bridge
