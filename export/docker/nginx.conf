server {
    listen 80;
    server_name _;

    # API requests
    location /api/ {
        proxy_pass http://spissky-hrad-api:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # For large audio file uploads
        client_max_body_size 100M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Uploaded files
    location /uploads/ {
        proxy_pass http://spissky-hrad-api:8001/uploads/;
        proxy_set_header Host $host;
    }

    # Health check
    location /health {
        proxy_pass http://spissky-hrad-api:8001/api/health;
    }
}
