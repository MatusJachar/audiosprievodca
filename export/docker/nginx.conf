events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml audio/mpeg;

    # Upstream for backend
    upstream backend {
        server backend:8001;
    }

    server {
        listen 80;
        server_name _;

        # API routes - proxy to backend
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Increase timeout for audio streaming
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            # Allow large file uploads
            client_max_body_size 100M;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://backend/api/health;
        }

        # Static assets (if serving from nginx)
        location /assets/ {
            alias /app/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Default redirect or static page
        location / {
            return 200 'Spišský hrad API Server - Use /api/* endpoints';
            add_header Content-Type text/plain;
        }
    }

    # HTTPS server (uncomment and configure for SSL)
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     # Same location blocks as above
    # }
}
