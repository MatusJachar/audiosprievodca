version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: spissky-hrad-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: spis_castle_db
    volumes:
      - mongodb_data:/data/db
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "27017:27017"
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spissky-hrad-backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=spis_castle_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./audio:/app/audio:ro
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: spissky-hrad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
